name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic matches reference/expected_results.csv
        run: node test/check.mjs
      - name: Director-view invariants
        run: node test/insights.mjs
      - name: Spreadsheet edge cases
        run: node test/robustness.mjs
      - name: Sales view (sell-in = sell-through ± stock change)
        run: node test/sales.mjs
